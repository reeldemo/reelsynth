name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency diffs
    runs-on: ubuntu-latest
    # Requires Dependency graph in repo Settings → Code security.
    # Keep advisory until that is enabled for reeldemo/reelsynth.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          warn-only: true
          comment-summary-in-pr: never
