name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review dependency diffs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Comment a summary on the PR when possible.
          comment-summary-in-pr: on-failure
          # Cargo.lock changes are the source of truth for Rust.
          manifest-filters: |
            exclude:
              package-ecosystem: [npm, maven, nuget]

