name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: Run reelsynth core tests
        run: cargo test -p reelsynth

      - name: Run UI kittest audit suite
        run: cargo test -p reelsynth-ui --test kittest

      - name: Run UI library tests
        run: cargo test -p reelsynth-ui

  # Code smell / static quality — Clippy correctness is a hard gate;
  # rustfmt is advisory until a dedicated format pass lands.
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev

      - name: rustfmt (advisory)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Clippy code-smell gate
        # Deny correctness + suspicious (real smells / likely bugs).
        # Allow noisy style lints that dominate the current backlog.
        run: |
          cargo clippy --workspace --all-targets -- \
            -D clippy::correctness \
            -D clippy::suspicious \
            -W clippy::style \
            -W clippy::complexity \
            -W clippy::perf \
            -A clippy::too_many_arguments \
            -A clippy::needless_range_loop \
            -A clippy::manual_clamp \
            -A clippy::collapsible_if \
            -A clippy::redundant_closure \
            -A clippy::ptr_arg \
            -A clippy::module_inception \
            -A clippy::arc_with_non_send_sync

      - name: Surface rustfmt debt
        if: steps.fmt.outcome == 'failure'
        run: |
          echo "::warning::rustfmt check failed (advisory). Run 'cargo fmt --all' in a follow-up PR to make fmt a hard gate."

  security:
    name: Security (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: security

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo audit (RUSTSEC advisories)
        # Ignores documented in .cargo/audit.toml (egui-pinned / optional pyo3).
        # Unmaintained/unsound stay informational; deny.toml is the hard gate.
        run: cargo audit

      - name: cargo deny (advisories, licenses, sources)
        run: cargo deny --workspace --all-features check advisories licenses sources

