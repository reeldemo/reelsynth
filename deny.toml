# cargo-deny — advisories, licenses, and source hygiene for the workspace.
# CI runs: cargo deny --workspace --all-features check advisories licenses sources
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

[advisories]
version = 2
# yanked: warn | deny | allow (string lint level)
yanked = "warn"
# unmaintained / unsound: all | workspace | transitive | none
# Transitive ATsPI/egui crates are often marked unmaintained; do not hard-fail CI on those.
unmaintained = "workspace"
unsound = "workspace"
# Vulnerability is deny by default. Ignore only transitive issues blocked on
# egui/eframe 0.30 or optional pyo3 pin — revisit when those stacks bump.
ignore = [
    # quick-xml: pinned by wayland-scanner / zbus_xml via egui-winit 0.30.
    { id = "RUSTSEC-2026-0194", reason = "Transitive via egui/eframe 0.30 (wayland-scanner / zbus_xml). No semver-compatible upgrade path until egui stack moves." },
    { id = "RUSTSEC-2026-0195", reason = "Transitive via egui/eframe 0.30 (wayland-scanner / zbus_xml). No semver-compatible upgrade path until egui stack moves." },
    # pyo3: optional python feature pinned at ^0.22 for maturin ABI stability.
    { id = "RUSTSEC-2025-0020", reason = "Optional pyo3 ^0.22 feature; fix requires pyo3 >=0.24 (planned with next python-binding bump)." },
    { id = "RUSTSEC-2026-0177", reason = "Optional pyo3 ^0.22 feature; fix requires pyo3 >=0.29 (planned with next python-binding bump)." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    # VST3 / nih_plug plugin stack (copyleft; expected for the plugin crate).
    "GPL-3.0",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    # Font files pulled by egui / epaint.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LicenseRef-UFL-1.0",
]
unused-allowed-license = "allow"
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# nih_plug / baseview plugin stack (git deps; not on crates.io pins we use).
allow-git = [
    "https://github.com/robbert-vdh/vst3-sys.git",
    "https://github.com/robbert-vdh/nih-plug.git",
    "https://github.com/RustAudio/baseview.git",
    "https://github.com/micahrj/clap-sys.git",
    "https://github.com/BillyDM/egui-baseview.git",
]

